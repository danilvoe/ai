{% extends "base.html" %}
{% block title %}Вход — Рецепты{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-card">
  <a class="brand auth-brand" href="https://grill-bbq.ru" target="_blank"
     rel="noopener noreferrer" title="grill-bbq.ru">
    <img src="{{ url_for('static', filename='logo.svg') }}"
         alt="grill-bbq.ru" class="brand-logo">
  </a>
  <h1>Вход</h1>
  <p class="muted">Локальный сервис рецептов с RAG.</p>
  <form id="login-form" autocomplete="on">
    <label>Имя пользователя
      <input type="text" name="username" id="username" required minlength="3" autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" id="password" required minlength="6">
    </label>
    <button type="submit">Войти</button>
    <p class="error" id="error" hidden></p>
  </form>
  <p class="muted">Нет аккаунта? <a href="{{ url_for('pages.register') }}">Зарегистрироваться</a></p>
</main>
{% endblock %}
